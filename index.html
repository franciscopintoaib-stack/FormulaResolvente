<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>
<body>

  <input type="number" id="a" placeholder="Valor de a">
  <input type="number" id="b" placeholder="Valor de b">
  <input type="number" id="c" placeholder="Valor de c">
  <button onclick="calcular()">Calcular</button>

  <p id="resultado"></p>

  <script>
    function calcular() {
      let a = Number(document.getElementById("a").value);
      let b = Number(document.getElementById("b").value);
      let c = Number(document.getElementById("c").value);
      let res = document.getElementById("resultado");

      // 1. Impede que "a" seja 0
      if (a === 0) {
        res.textContent = "O valor de 'a' não pode ser zero.";
        return;
      }

      let delta = b * b - 4 * a * c;

      // 2. Arredonda para 2 casas decimais com .toFixed(2)
      if (delta >= 0) {
        let x1 = ((-b + Math.sqrt(delta)) / (2 * a)).toFixed(2);
        let x2 = ((-b - Math.sqrt(delta)) / (2 * a)).toFixed(2);
        res.textContent = "x1 = " + x1 + " e x2 = " + x2;
      } else {
        res.textContent = "Não existem raízes reais.";
      }
    }
    // 3. Basta alterar os números e clicar em "Calcular" novamente
  </script>

</body>
</html>
